<svg width="120" height="48" viewBox="0 0 120 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ITAS Monogram Mark -->
  <defs>
    <linearGradient id="itasGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2A900"/>
      <stop offset="100%" style="stop-color:#C78500"/>
    </linearGradient>
    <linearGradient id="itasTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FDF8F0"/>
      <stop offset="50%" style="stop-color:#F2A900"/>
      <stop offset="100%" style="stop-color:#FDF8F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- I - Vertical stroke with serifs -->
  <g transform="translate(2, 4)">
    <path d="M10 2 L10 38" stroke="url(#itasGradient)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M4 2 L16 2" stroke="url(#itasGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M4 38 L16 38" stroke="url(#itasGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- T - Top bar with stem -->
  <g transform="translate(28, 4)">
    <path d="M1 6 L27 6" stroke="url(#itasGradient)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M14 8 L14 38" stroke="url(#itasGradient)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- A - Triangle with crossbar -->
  <g transform="translate(54, 4)">
    <path d="M20 38 L2 4 L38 4 Z" stroke="url(#itasGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" fill="none"/>
    <path d="M7 24 L33 24" stroke="url(#itasGradient)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="20" cy="7" r="2" fill="url(#itasGradient)" filter="url(#glow)"/>
  </g>

  <!-- S - Curve -->
  <g transform="translate(84, 4)">
    <path d="M25 10 Q25 4 17 4 L11 4 Q4 4 4 10 Q4 16 14 21 Q24 26 24 31 Q24 38 16 38 L10 38 Q3 38 3 31" stroke="url(#itasGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" fill="none"/>
  </g>

  <!-- Decorative accent line under monogram -->
  <path d="M6 42 L114 42" stroke="url(#itasGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- ITAS Text wordmark -->
  <text x="8" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.08em" fill="url(#itasTextGradient)" style="font-variant-caps: small-caps;">ITAS SYSTEM</text>
  <text x="8" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="600" letter-spacing="0.15em" fill="#FDF8F0" opacity="0.5">ABASTO SOCIAL</text>
</svg>